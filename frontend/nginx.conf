# ─────────────────────────────────────────────────────────────
#  nginx.conf  —  Configuration du reverse proxy Nginx
# ─────────────────────────────────────────────────────────────
#
#  Ce fichier configure Nginx pour :
#   1. Servir les fichiers HTML statiques (front-end)
#   2. Rediriger toutes les requêtes /api/* vers le service API
#
#  Dans Docker Swarm, les services communiquent par leur NOM
#  défini dans stack.yml via le réseau overlay "app-net".
#  Ici, le service Node.js s'appelle "api" → Nginx peut
#  l'appeler simplement par "api" (résolution DNS interne).
#
server {
    # Écoute sur le port 80 (port exposé par Docker)
    listen 80;

    # ── Racine du front-end statique ──────────────────────────
    # Tous les fichiers dans /usr/share/nginx/html/ sont servis
    # directement (HTML, CSS, JS, images…)
    location / {
        root  /usr/share/nginx/html;
        index index.html;

        # try_files : cherche d'abord le fichier exact,
        # puis redirige vers index.html (utile pour les SPA)
        try_files $uri $uri/ /index.html;
    }

    # ── Reverse proxy vers l'API Node.js ─────────────────────
    # Toute requête commençant par /api/ est transmise
    # au service "api" sur le port 3000 (réseau overlay).
    #
    # Exemple : GET /api/hello  →  http://api:3000/api/hello
    #           GET /api/health →  http://api:3000/api/health
    #
    location /api/ {
        # "api" = nom du service dans stack.yml
        # Docker Swarm résout ce nom en VIP (Virtual IP)
        # qui load-balance automatiquement entre les replicas
        proxy_pass http://api:3000;

        # Transmettre les vraies infos du client à l'API
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

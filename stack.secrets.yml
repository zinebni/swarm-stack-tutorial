# ═══════════════════════════════════════════════════════════════
#  stack.secrets.yml  —  Variante de la stack avec Docker Secrets
# ═══════════════════════════════════════════════════════════════
#
#  Ce fichier est une EXTENSION du stack.yml principal.
#  Il montre comment utiliser les secrets Docker pour
#  ne PAS mettre de données sensibles en clair dans stack.yml.
#
#  ❌ Mauvaise pratique (ne JAMAIS faire en prod) :
#       environment:
#         - DB_PASSWORD=monmotdepasse123   ← visible dans les logs !
#
#  ✅ Bonne pratique avec Docker Secrets :
#       Le secret est chiffré dans le Raft log du Swarm
#       et monté en mémoire dans le conteneur sous /run/secrets/
#
#  ─────────────────────────────────────────────────────────────
#  COMMENT UTILISER CE FICHIER :
#
#  Étape 1 — Créer le secret dans le Swarm :
#    echo "ma_cle_api_secrete_1234" | docker secret create api_key -
#
#  Étape 2 — Déployer avec les DEUX fichiers (merge) :
#    docker stack deploy \
#      -c stack.yml \
#      -c stack.secrets.yml \
#      demo
#
#  Docker fusionne (merge) les deux fichiers dans l'ordre.
#  stack.secrets.yml vient APRÈS stack.yml donc ses valeurs
#  écrasent celles de stack.yml si elles sont dupliquées.
#
#  Étape 3 — Vérifier les secrets disponibles :
#    docker secret ls
#
#  Étape 4 — Dans le conteneur, le secret est disponible ici :
#    /run/secrets/api_key   (fichier texte, lire avec fs.readFileSync)
#
# ═══════════════════════════════════════════════════════════════

version: "3.8"

services:

  # ── Override du service "api" pour lui ajouter un secret ─────
  #
  # Docker fusionne ce bloc avec celui de stack.yml.
  # Seules les clés présentes ici sont modifiées ou ajoutées.
  api:
    # Déclaration des secrets accessibles à CE service
    # Swarm monte chaque secret dans /run/secrets/<nom>
    secrets:
      - api_key   # → /run/secrets/api_key dans le conteneur

    # On peut aussi passer l'info qu'un secret est utilisé
    # via une variable d'environnement (non le secret lui-même !)
    environment:
      - APP_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Bonne pratique : indiquer quel secret utiliser
      # sans révéler sa valeur. Le code lit /run/secrets/api_key
      - API_KEY_FILE=/run/secrets/api_key


# ───────────────────────────────────────────────────────────────
#  SECRETS
#  Définition des secrets utilisés dans cette stack
# ───────────────────────────────────────────────────────────────
secrets:

  api_key:
    # "external: true" signifie que le secret doit DÉJÀ exister
    # dans le Swarm avant le déploiement de la stack.
    # Il a été créé avec : docker secret create api_key -
    #
    # Si external: false (ou absent), Docker essaie de créer
    # le secret à partir d'un fichier local — DÉCONSEILLÉ en prod
    # car le fichier contiendrait alors des données en clair.
    external: true

    # Optionnel : si le nom dans le Swarm diffère du nom dans le YAML
    # name: mon_secret_swarm_api_key
